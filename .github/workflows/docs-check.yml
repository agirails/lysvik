name: docs gate
# The drift gate: docs must agree with their pinned world-API contract and
# carry honest status. See tools/docs_check.py for the rules (D1–D7).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: gate rules on the real tree
        run: python3 tools/docs_check.py
      - name: red probes (the gate can still go red)
        run: python3 tools/test_docs_check.py
      - name: canonical heartbeat smoke (D8 — the executable half of "don't improvise it")
        run: node examples/heartbeat.smoke.mjs

  # S143 — the EXECUTION half of the examples lockfile (Arha/Atlas): a keystore-free
  # box runs the real install (scripts ON — that is the point) and then loads the
  # SDK entry so the runtime ws path (rpc-websockets / isows) is exercised, not
  # merely read. No secrets exist on this runner; nothing here touches a key.
  examples-install:
    runs-on: ubuntu-latest
    # Install scripts run here on purpose; only OUR branches earn that (Arha, S143):
    # a fork PR editing the manifest must not get a postinstall executed on demand.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    defaults:
      run:
        working-directory: examples
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
      - name: npm ci (exact pins, install scripts run on this throwaway box)
        run: npm ci
      - name: resolved ws is the override, and only one copy
        run: |
          node -e "const v=require('ws/package.json').version; console.log('ws', v); if(!/^8\.(2[1-9]|[3-9]\d)\./.test(v)) process.exit(1)"
          test "$(find node_modules -path '*node_modules/ws/package.json' | wc -l)" -eq 1
      - name: the SDK entry loads with ws 8.21.x underneath (runtime, not lockfile)
        run: node -e "const s=require('@agirails/sdk'); if(typeof s.ACTPClient!=='function') process.exit(1); console.log('ACTPClient loaded')"
      - name: heartbeat smoke
        run: node heartbeat.smoke.mjs
      - name: no credential artefact on disk
        run: test ! -f .env && test ! -d .actp
