<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480" role="img" aria-label="Lysvik emblem — a hearth flame beneath the aurora">
  <defs>
    <radialGradient id="sky" cx="50%" cy="34%" r="72%">
      <stop offset="0%" stop-color="#16375a"/>
      <stop offset="55%" stop-color="#0c2036"/>
      <stop offset="100%" stop-color="#081521"/>
    </radialGradient>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4be0a8"/>
      <stop offset="50%" stop-color="#63b8ff"/>
      <stop offset="100%" stop-color="#b58bff"/>
    </linearGradient>
    <radialGradient id="hearthGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffcf7a" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#f4a94b" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#f4a94b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe6a3"/>
      <stop offset="45%" stop-color="#f7b45a"/>
      <stop offset="100%" stop-color="#e8722e"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="60%" r="55%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffe6a3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ringgold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e9c67a"/>
      <stop offset="100%" stop-color="#b98a3e"/>
    </linearGradient>
    <clipPath id="disc"><circle cx="240" cy="240" r="222"/></clipPath>
  </defs>

  <!-- seal body -->
  <circle cx="240" cy="240" r="222" fill="url(#sky)"/>

  <g clip-path="url(#disc)">
    <!-- aurora arcs -->
    <path d="M 40,168 C 140,110 340,110 440,178" fill="none" stroke="url(#aurora)" stroke-width="7" stroke-linecap="round" opacity="0.55"/>
    <path d="M 52,196 C 150,150 330,150 428,204" fill="none" stroke="url(#aurora)" stroke-width="4.5" stroke-linecap="round" opacity="0.42"/>
    <path d="M 70,150 C 160,104 320,104 410,156" fill="none" stroke="url(#aurora)" stroke-width="3" stroke-linecap="round" opacity="0.30"/>

    <!-- stars -->
    <g fill="#eaf4ff">
      <circle cx="120" cy="120" r="1.7" opacity="0.9"/>
      <circle cx="352" cy="126" r="1.5" opacity="0.8"/>
      <circle cx="300" cy="96" r="1.2" opacity="0.7"/>
      <circle cx="168" cy="92" r="1.3" opacity="0.7"/>
      <circle cx="392" cy="176" r="1.6" opacity="0.85"/>
      <circle cx="86" cy="176" r="1.4" opacity="0.8"/>
      <circle cx="238" cy="78" r="1.5" opacity="0.75"/>
      <circle cx="410" cy="132" r="1.1" opacity="0.6"/>
    </g>

    <!-- fjord mountains -->
    <polygon points="-10,320 70,250 132,292 210,222 292,286 372,240 490,318 490,490 -10,490"
             fill="#0a1a2a"/>
    <polygon points="-10,352 96,300 176,338 260,296 344,342 430,306 490,352 490,490 -10,490"
             fill="#07131f"/>

    <!-- hearth glow -->
    <ellipse cx="240" cy="262" rx="86" ry="96" fill="url(#hearthGlow)"/>

    <!-- flame -->
    <path d="M240,168 C 280,222 276,258 258,282 C 249,294 249,300 240,312 C 231,300 231,294 222,282 C 204,258 200,222 240,168 Z"
          fill="url(#flame)"/>
    <path d="M240,206 C 262,240 260,262 250,278 C 244,286 244,292 240,300 C 236,292 236,286 230,278 C 220,262 218,240 240,206 Z"
          fill="#ffdf8f" opacity="0.9"/>
    <ellipse cx="240" cy="284" rx="16" ry="22" fill="url(#core)"/>
  </g>

  <!-- ring text -->
  <path id="topArc" d="M 96,182 A 168,168 0 0 1 384,182" fill="none"/>
  <path id="botArc" d="M 100,300 A 172,172 0 0 0 380,300" fill="none"/>
  <g font-family="Georgia, 'Times New Roman', serif" fill="#e9c67a">
    <text font-size="30" letter-spacing="14" text-anchor="middle" font-weight="bold">
      <textPath href="#topArc" startOffset="50%">LYSVIK</textPath>
    </text>
    <text font-size="12.5" letter-spacing="6" text-anchor="middle" fill="#8fb9d6">
      <textPath href="#botArc" startOffset="50%">AGIRAILS · ACTP · BASE</textPath>
    </text>
  </g>

  <!-- rings + studs -->
  <circle cx="240" cy="240" r="222" fill="none" stroke="url(#ringgold)" stroke-width="4"/>
  <circle cx="240" cy="240" r="210" fill="none" stroke="url(#ringgold)" stroke-width="1.4" opacity="0.7"/>
  <g fill="#e9c67a">
    <rect x="236" y="12" width="8" height="8" transform="rotate(45 240 16)"/>
    <rect x="236" y="460" width="8" height="8" transform="rotate(45 240 464)"/>
    <rect x="12" y="236" width="8" height="8" transform="rotate(45 16 240)"/>
    <rect x="460" y="236" width="8" height="8" transform="rotate(45 464 240)"/>
  </g>
</svg>
